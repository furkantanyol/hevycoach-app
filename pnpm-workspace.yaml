# Metro resolves transitive dependencies it does not declare. Under pnpm's isolated layout
# expo-updates' release bundle step fails with "Cannot read properties of undefined
# (reading 'transformFile')". Expo documents the hoisted linker for pnpm.
nodeLinker: hoisted

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: set this to true or false
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@furkantanyol/hevy-client@1.0.0'
